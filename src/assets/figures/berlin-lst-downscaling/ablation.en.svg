<svg class="figure-svg fig-wide" width="840" height="360" viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-lst-ablation-t fig-lst-ablation-d">
  <title id="fig-lst-ablation-t">One fixed model, changing inputs</title>
  <desc id="fig-lst-ablation-d">Matrix with five columns: spectral, morphology, shadows, weather, embeddings. Nine rows in three groups. Adding groups: stage 1 uses spectral, stage 2 spectral and morphology, stage 3 adds shadows, stage 4 adds weather. Leaving one group out: without morphology uses spectral, shadows and weather; without shadows uses spectral, morphology and weather; without weather uses spectral, morphology and shadows. Cross-check: embeddings instead of morphology and shadows uses spectral, weather and embeddings. A filled square means included, an empty square means not included. On the right a highlighted box spans all rows: the same U-Net in every run, each row joined to it by a thin line.</desc>
