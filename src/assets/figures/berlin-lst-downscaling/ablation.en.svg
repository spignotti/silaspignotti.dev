  <text class="fig-hd" x="203" y="53" text-anchor="middle">green, SWIR</text>
  <text class="fig-hd" x="289" y="38" text-anchor="middle">Red, NIR,</text>
  <text class="fig-hd" x="289" y="53" text-anchor="middle">NDBI, albedo</text>
  <text class="fig-hd" x="355" y="38" text-anchor="middle">NDVI,</text>
  <text class="fig-hd" x="355" y="53" text-anchor="middle">NDWI</text>
