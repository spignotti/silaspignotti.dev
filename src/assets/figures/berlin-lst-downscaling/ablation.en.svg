<svg class="figure-svg fig-wide" width="840" height="430" viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-lst-ablation-t fig-lst-ablation-d">
  <title id="fig-lst-ablation-t">One fixed model, changing inputs</title>
  <desc id="fig-lst-ablation-d">Matrix with nine rows and six columns for groups of input data, plus a narrow column for the training target on the right. The first three columns share the header Spectral: blue, green and SWIR; red, NIR, NDBI and albedo; NDVI and NDWI. Morphology, shadows and weather follow. The rows sit in two groups; a filled square means included, an outline means not included. Adding groups: stage 1 uses the three spectral columns, stage 2 adds morphology, stage 3 adds shadows, stage 4 adds weather, stage 5 uses all six groups with a thermal-aware training target. Leaving one group out: without morphology, without shadows, without NDVI and NDWI, and without red, NIR and indices. On the right a highlighted box spans all rows: the same U-Net in every run, each row joined to it by a thin line. Below it: without weather is the same as stage 3.</desc>
