<svg class="figure-svg fig-wide" width="840" height="430" viewBox="0 0 840 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-lst-ablation-t fig-lst-ablation-d">
  <title id="fig-lst-ablation-t">Ein festes Modell, wechselnde Eingänge</title>
  <desc id="fig-lst-ablation-d">Matrix mit neun Zeilen und sechs Spalten für Gruppen von Eingangsdaten, rechts daneben eine schmale Spalte für das Trainingsziel. Die ersten drei Spalten tragen die gemeinsame Überschrift Spektral: Blau, Grün und SWIR; Rot, NIR, NDBI und Albedo; NDVI und NDWI. Es folgen Morphologie, Schatten und Wetter. Die Zeilen stehen in zwei Gruppen; ein gefülltes Quadrat heißt enthalten, ein Umriss heißt nicht enthalten. Gruppen hinzufügen: Stufe 1 nutzt die drei spektralen Spalten, Stufe 2 zusätzlich Morphologie, Stufe 3 zusätzlich Schatten, Stufe 4 zusätzlich Wetter, Stufe 5 alle sechs Gruppen mit thermalsensitivem Trainingsziel. Je eine Gruppe weglassen: ohne Morphologie, ohne Schatten, ohne NDVI und NDWI sowie ohne Rot, NIR und Indizes. Rechts spannt ein hervorgehobener Kasten über alle Zeilen: dasselbe U-Net in allen Läufen, jede Zeile ist mit einer dünnen Linie verbunden. Darunter steht: Ohne Wetter entspricht Stufe 3.</desc>
