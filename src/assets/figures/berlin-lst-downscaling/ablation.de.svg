<svg class="figure-svg fig-wide" width="840" height="360" viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-lst-ablation-t fig-lst-ablation-d">
  <title id="fig-lst-ablation-t">Ein festes Modell, wechselnde Eingänge</title>
  <desc id="fig-lst-ablation-d">Matrix mit fünf Spalten: Spektral, Morphologie, Schatten, Wetter, Embeddings. Neun Zeilen in drei Gruppen. Gruppen hinzufügen: Stufe 1 nutzt Spektral, Stufe 2 Spektral und Morphologie, Stufe 3 zusätzlich Schatten, Stufe 4 zusätzlich Wetter. Je eine Gruppe weglassen: ohne Morphologie nutzt Spektral, Schatten und Wetter; ohne Schatten nutzt Spektral, Morphologie und Wetter; ohne Wetter nutzt Spektral, Morphologie und Schatten. Gegenprobe: Embeddings statt Morphologie und Schatten nutzt Spektral, Wetter und Embeddings. Ein gefülltes Quadrat heißt enthalten, ein leeres heißt nicht enthalten. Rechts spannt ein hervorgehobener Kasten über alle Zeilen: dasselbe U-Net in allen Läufen, jede Zeile ist mit einer dünnen Linie verbunden.</desc>
