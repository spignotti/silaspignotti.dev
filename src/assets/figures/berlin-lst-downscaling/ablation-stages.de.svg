  <rect class="fig-box" x="518.3" y="88.8" width="148.5" height="28.5" rx="6"/>
  <text class="fig-t-b" x="529.5" y="108">+ Wetter</text>
  <path class="fig-ln" d="M592.5 226V246"/>
  <text class="fig-hd" x="690" y="14">Stufe 5</text>
  <rect class="fig-box-quiet" x="690.8" y="196.8" width="148.5" height="28.5" rx="6"/>
