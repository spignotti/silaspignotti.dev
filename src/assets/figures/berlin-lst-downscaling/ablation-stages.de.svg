  <text class="fig-t-muted" x="184.5" y="216">Spektral</text>
  <rect class="fig-box" x="173.3" y="160.8" width="148.5" height="28.5" rx="6"/>
  <text class="fig-t-b" x="184.5" y="180">+ Morphologie</text>
  <path class="fig-ln" d="M247.5 226V246"/>
  <text class="fig-hd" x="345" y="14">Stufe 3</text>
