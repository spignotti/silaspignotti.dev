<svg class="figure-svg fig-wide" width="840" height="290" viewBox="0 0 840 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-lst-stages-t fig-lst-stages-d">
  <title id="fig-lst-stages-t">Fünf Stufen auf einem festen Modell</title>
  <desc id="fig-lst-stages-d">Fünf Spalten, Stufe 1 bis 5, auf demselben residualen 2D-U-Net. Stufe 1 nutzt Spektraldaten, Stufe 2 fügt Morphologie hinzu, Stufe 3 Schatten, Stufe 4 Wetter. Stufe 5 hat dieselben Eingänge und ein thermalsensitives Trainingsziel. Hervorgehoben ist Stufe 1, die Grundlage aller weiteren Stufen.</desc>
