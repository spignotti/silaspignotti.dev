  <text class="fig-t-b" x="357" y="144">+ Schatten</text>
  <path class="fig-ln" d="M420 226V246"/>
  <text class="fig-hd" x="517.5" y="14">Stufe 4</text>
  <rect class="fig-box-quiet" x="518.3" y="196.8" width="148.5" height="28.5" rx="6"/>
  <text class="fig-t-muted" x="529.5" y="216">Spektral</text>
  <rect class="fig-box-quiet" x="518.3" y="160.8" width="148.5" height="28.5" rx="6"/>
