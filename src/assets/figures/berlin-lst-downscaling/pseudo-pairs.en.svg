<svg class="figure-svg fig-wide" width="840" height="300" viewBox="0 0 840 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-lst-pairs-t fig-lst-pairs-d">
  <title id="fig-lst-pairs-t">Train one level coarser, apply one level finer</title>
  <desc id="fig-lst-pairs-d">Two rows, labelled training and application. In the training row a coarse raster of 2 by 2 cells goes as input 1000 m into the U-Net and comes out as a middle raster of 6 by 6 cells, target 100 m (Landsat). In the application row the middle raster goes in as input 100 m and comes out as a fine raster of 18 by 18 cells, output 10 m. The same U-Net sits between the inputs and outputs of both rows and is highlighted, the same in both steps. To the right of the output an arrow leads to a quiet box evaluation at 100 m: the 10 m output aggregated, compared with Landsat.</desc>
