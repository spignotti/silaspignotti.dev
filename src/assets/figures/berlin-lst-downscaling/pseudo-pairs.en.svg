  <text class="fig-t-s" x="116" y="127" text-anchor="middle">Input 1000 m</text>
  <text class="fig-t-s" x="116" y="267" text-anchor="middle">Input 100 m</text>
  <text class="fig-t-s" x="496" y="127" text-anchor="middle">Target 100 m (Landsat)</text>
