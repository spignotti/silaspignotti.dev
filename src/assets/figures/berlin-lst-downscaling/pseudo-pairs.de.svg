<svg class="figure-svg fig-wide" width="840" height="300" viewBox="0 0 840 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-lst-pairs-t fig-lst-pairs-d">
  <title id="fig-lst-pairs-t">Eine Ebene gröber trainieren, eine Ebene feiner anwenden</title>
  <desc id="fig-lst-pairs-d">Zwei Zeilen, beschriftet Training und Anwendung. In der Training-Zeile geht ein grobes Raster aus 2 mal 2 Zellen als Eingang 1000 m in das U-Net und kommt als mittleres Raster aus 6 mal 6 Zellen heraus, Ziel 100 m (Landsat). In der Anwendung-Zeile geht das mittlere Raster als Eingang 100 m hinein und kommt als feines Raster aus 18 mal 18 Zellen heraus, Ausgabe 10 m. Dasselbe U-Net steht zwischen Eingang und Ausgang beider Zeilen und ist hervorgehoben, in beiden Schritten gleich. Rechts neben der Ausgabe führt ein Pfeil zu einer ruhigen Box Bewertung auf 100 m: die 10-m-Ausgabe zusammengefasst, mit Landsat verglichen.</desc>
  <text class="fig-hd" x="8" y="75">Training</text>
  <text class="fig-hd" x="8" y="215">Anwendung</text>
