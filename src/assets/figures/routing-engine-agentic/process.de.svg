<svg class="figure-svg fig-wide" width="840" height="202" viewBox="0 0 840 202" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-rea-process-t fig-rea-process-d">
  <title id="fig-rea-process-t">Vom Issue bis in den Betrieb</title>
  <desc id="fig-rea-process-d">Ablauf von links nach rechts: Issue, Plan, ein Agent setzt im Worktree um, Checks und Review, Merge, Release-Tag, nächtlicher Deploy. Checks und Review bestehen aus CI-Checks, einem Review durch ein zweites Modell und einer Prüfung in der laufenden App. Migrationen, Login, Zugangsdaten und Deploy zweigen gestrichelt ab und warten auf Freigabe. Hervorgehoben sind Checks und Review.</desc>
