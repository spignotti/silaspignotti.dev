<svg class="figure-svg fig-wide" width="840" height="202" viewBox="0 0 840 202" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-rea-process-t fig-rea-process-d">
  <title id="fig-rea-process-t">From issue to production</title>
  <desc id="fig-rea-process-d">Flow from left to right: issue, plan, an agent implements in a worktree, checks and review, merge, release tag, nightly deploy. Checks and review consist of CI checks, a review by a second model and a check in the running app. Migrations, login, credentials and deploy branch off, dashed, and wait for approval. Checks and review are highlighted.</desc>
