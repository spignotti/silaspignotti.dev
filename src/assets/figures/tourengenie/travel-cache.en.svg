<svg class="figure-svg fig-wide" width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-tg-cache-t fig-tg-cache-d">
  <title id="fig-tg-cache-t">A new stop needs only 2n edges</title>
  <desc id="fig-tg-cache-d">Square travel time matrix with seven rows and seven columns, cells of 22 pixels with three pixel gaps. The top left holds the six existing stops as a 6 by 6 field, filled quietly. The seventh row and the seventh column belong to the new stop and are the only accent area. The bottom right cell, new stop to new stop, stays empty. The axes are labelled: to on top, from on the left, new under the seventh column and beside the seventh row. The legend on the right reads: n existing stops occupy n² edges in the cache; a new stop needs only 2n new edges, there and back; recomputing the whole matrix would mean n² edges.</desc>
