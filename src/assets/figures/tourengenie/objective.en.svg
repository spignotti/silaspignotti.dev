<svg class="figure-svg fig-wide" width="840" height="224" viewBox="0 0 840 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-tg-objective-t fig-tg-objective-d">
  <title id="fig-tg-objective-t">A fixed ranking in the objective</title>
  <desc id="fig-tg-objective-d">Four rows, each with a rank number, a goal and a note on when that level decides. Rank 1: all due jobs planned, always counts first. Rank 2: as few tours as possible, if the same number of jobs is planned. Rank 3: as little travel time as possible, if the tour count is equal. Rank 4: as short a distance as possible, if the travel time is equal. A bracket on the right joins the four rows: one integer objective, each level outweighs all levels below. Rank 1 is highlighted.</desc>
  <text class="fig-num" x="12" y="35" text-anchor="middle">1</text>
  <rect class="fig-focus" x="24.8" y="8.8" width="298.5" height="42.5" rx="6"/>
  <text class="fig-t-on" x="174" y="35" text-anchor="middle">All due jobs planned</text>
  <text class="fig-t-s" x="336" y="35" text-anchor="start">always counts first</text>
  <text class="fig-num" x="12" y="87" text-anchor="middle">2</text>
  <rect class="fig-box" x="24.8" y="60.8" width="298.5" height="42.5" rx="6"/>
  <text class="fig-t" x="174" y="87" text-anchor="middle">As few tours as possible</text>
  <text class="fig-t-s" x="336" y="79.5" text-anchor="start">if the same number of</text>
  <text class="fig-t-s" x="336" y="94.5" text-anchor="start">jobs is planned</text>
  <text class="fig-num" x="12" y="139" text-anchor="middle">3</text>
  <rect class="fig-box" x="24.8" y="112.8" width="298.5" height="42.5" rx="6"/>
  <text class="fig-t" x="174" y="139" text-anchor="middle">As little travel time as possible</text>
  <text class="fig-t-s" x="336" y="139" text-anchor="start">if the tour count is equal</text>
  <text class="fig-num" x="12" y="191" text-anchor="middle">4</text>
  <rect class="fig-box" x="24.8" y="164.8" width="298.5" height="42.5" rx="6"/>
  <text class="fig-t" x="174" y="191" text-anchor="middle">As short a distance as possible</text>
  <text class="fig-t-s" x="336" y="191" text-anchor="start">if the travel time is equal</text>
  <path class="fig-ln" d="M545 8H552V208H545"/>
  <text class="fig-t-s" x="564" y="105.5" text-anchor="start">One integer objective:</text>
  <text class="fig-t-s" x="564" y="120.5" text-anchor="start">each level outweighs all levels below</text>
</svg>
