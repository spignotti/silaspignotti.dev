<svg class="figure-svg fig-wide" width="840" height="240" viewBox="0 0 840 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-tg-cache-t fig-tg-cache-d">
  <title id="fig-tg-cache-t">Ein neuer Stopp braucht nur 2n Kanten</title>
  <desc id="fig-tg-cache-d">Quadratische Fahrzeitmatrix mit sieben Zeilen und sieben Spalten, Felder von 22 Pixeln mit drei Pixeln Abstand. Oben links liegen die sechs vorhandenen Stopps als 6 mal 6 Felder, sie sind ruhig gefüllt. Die siebte Zeile und die siebte Spalte gehören zum neuen Stopp und sind die einzige akzentfarbene Fläche. Das Feld unten rechts, neuer Stopp zu neuem Stopp, bleibt leer. Die Achsen sind beschriftet: oben nach, links von, unter der siebten Spalte und neben der siebten Zeile neu. Rechts stehen drei Legendeneinträge: n vorhandene Stopps belegen n² Kanten im Cache; ein neuer Stopp braucht nur 2n neue Kanten, hin und zurück; die ganze Matrix neu zu berechnen hieße n² Kanten.</desc>
