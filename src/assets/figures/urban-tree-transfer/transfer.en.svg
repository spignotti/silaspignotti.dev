<svg class="figure-svg fig-wide" width="840" height="380" viewBox="0 0 840 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-utt-transfer-t fig-utt-transfer-d">
  <title id="fig-utt-transfer-t">Leipzig: score by share of local data</title>
  <desc id="fig-utt-transfer-d">Line chart: weighted F1 from 0.3 to 0.8 against the share of Leipzig training data. Highlighted is the line of the Berlin model, fine-tuned. Values: without Leipzig data 0.38, at 10 percent 0.50, at 25 percent 0.57, at 50 percent 0.66, at 100 percent 0.77. Two dashed references: Leipzig only, from scratch 0.79, and Berlin in its own test 0.75.</desc>
