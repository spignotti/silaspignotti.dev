<svg class="figure-svg fig-wide" width="840" height="348" viewBox="0 0 840 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-utt-transfer-t fig-utt-transfer-d">
  <title id="fig-utt-transfer-t">Leipzig: score by share of local data</title>
  <desc id="fig-utt-transfer-d">Line chart: weighted F1 of the Berlin model in Leipzig, fine-tuned with 0, 10, 25, 50 and 100 percent of the Leipzig training data; the five steps are evenly spaced. Values: without Leipzig data (zero-shot) 0.38, at 10 percent 0.50, at 25 percent 0.57, at 50 percent 0.66, at 100 percent 0.77. Two dashed reference lines: a model trained from scratch on Leipzig data only, 0.79, and the Berlin model on the Berlin test set, 0.75. The line of the fine-tuned Berlin model is highlighted.</desc>
