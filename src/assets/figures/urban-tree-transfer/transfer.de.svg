<svg class="figure-svg fig-wide" width="840" height="348" viewBox="0 0 840 348" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-utt-transfer-t fig-utt-transfer-d">
  <title id="fig-utt-transfer-t">Leipzig: Ergebnis nach Anteil lokaler Daten</title>
  <desc id="fig-utt-transfer-d">Liniendiagramm: gewichteter F1 des Berlin-Modells in Leipzig, nachtrainiert mit 0, 10, 25, 50 und 100 Prozent der Leipziger Trainingsdaten; die fünf Stufen stehen in gleichem Abstand. Werte: ohne Leipziger Daten (Zero-Shot) 0,38, bei 10 Prozent 0,50, bei 25 Prozent 0,57, bei 50 Prozent 0,66, bei 100 Prozent 0,77. Zwei gestrichelte Vergleichslinien: ein Modell nur mit Leipziger Daten, von Grund auf trainiert, 0,79, und das Berlin-Modell im Berliner Test, 0,75. Hervorgehoben ist die Linie des nachtrainierten Berlin-Modells.</desc>
