<svg class="figure-svg fig-wide" width="840" height="270" viewBox="0 0 840 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-utt-blocks-t fig-utt-blocks-d">
  <title id="fig-utt-blocks-t">Zufällige Aufteilung gegen räumliche Blöcke</title>
  <desc id="fig-utt-blocks-d">Zwei Felder nebeneinander, jedes mit zehn mal sechs Baumpunkten auf einem feinen Raster. Im linken Feld Zufällige Aufteilung sind die Punkte einzeln und gemischt Training oder Test, etwa jeder fünfte ist Test. Im rechten Feld Räumliche Blöcke, 1200 m teilen dickere Linien das Feld in fünf mal drei Blöcke zu je zwei mal zwei Bäumen. Ganze Blöcke sind Training oder Test; drei Testblöcke sind akzentfarben hinterlegt und ihre Punkte nur umrandet. Unter dem linken Feld steht: Nachbarbäume landen in Training und Test, das Ergebnis wirkt zu gut. Unter dem rechten: Ganze Blöcke sind Training oder Test, der Test misst echte Übertragung. Unten eine Legende: gefüllter Punkt Training, offener Punkt Test. Hervorgehoben sind die drei Testblöcke.</desc>
