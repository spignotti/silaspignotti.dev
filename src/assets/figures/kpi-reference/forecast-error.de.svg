<svg class="figure-svg" width="560" height="140" viewBox="0 0 560 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-kpi-error-t fig-kpi-error-d">
  <title id="fig-kpi-error-t">Prognosefehler im Rückblick</title>
  <desc id="fig-kpi-error-d">Zwei waagerechte Balken, gewichteter mittlerer absoluter Prozentfehler (WMAPE) über 1.300 Prognosefälle: Vorjahr als Prognose 20,12 Prozent, gewähltes Modell 8,42 Prozent. Hervorgehoben ist das gewählte Modell.</desc>
  <text class="fig-t-muted" x="0" y="14">Vorjahr als Prognose</text>
