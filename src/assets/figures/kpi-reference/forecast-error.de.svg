  <text class="fig-t-b" x="0" y="94">Gewähltes Modell</text>
  <rect class="fig-bar-acc" x="0" y="104" width="175.8" height="36" rx="2"/>
  <text class="fig-num-l fig-num-acc" x="187.8" y="130">8,42 %</text>
</svg>
