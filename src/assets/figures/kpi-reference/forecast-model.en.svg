<svg class="figure-svg fig-wide" width="840" height="64" viewBox="0 0 840 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-kpi-model-t fig-kpi-model-d">
  <title id="fig-kpi-model-t">Four factors, multiplied</title>
  <desc id="fig-kpi-model-d">Formula in one line: volume level times seasonal factor per month times working-day weight times site share gives the forecast. General form without company values. The forecast is highlighted.</desc>
  <rect class="fig-box" x="0.8" y="0.8" width="126.5" height="62.5" rx="6"/>
  <text class="fig-t" x="64" y="37" text-anchor="middle">Volume level</text>
  <rect class="fig-box" x="173.3" y="0.8" width="126.5" height="62.5" rx="6"/>
  <text class="fig-t" x="236.5" y="28" text-anchor="middle">Seasonal factor</text>
  <text class="fig-t" x="236.5" y="46" text-anchor="middle">(month)</text>
  <rect class="fig-box" x="345.8" y="0.8" width="148.5" height="62.5" rx="6"/>
  <text class="fig-t" x="420" y="37" text-anchor="middle">Working-day weight</text>
  <rect class="fig-box" x="540.3" y="0.8" width="126.5" height="62.5" rx="6"/>
  <text class="fig-t" x="603.5" y="37" text-anchor="middle">Site share</text>
  <rect class="fig-focus" x="712.8" y="0.8" width="126.5" height="62.5" rx="6"/>
  <text class="fig-t-on" x="776" y="37" text-anchor="middle">Forecast</text>
  <text class="fig-t-op" x="150.3" y="41" text-anchor="middle">×</text>
  <text class="fig-t-op" x="322.8" y="41" text-anchor="middle">×</text>
  <text class="fig-t-op" x="517.3" y="41" text-anchor="middle">×</text>
  <text class="fig-t-op" x="689.8" y="41" text-anchor="middle">=</text>
</svg>
